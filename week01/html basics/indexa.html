<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title> formatting text </title>
</head>
    
    
<body>
    
   <header>
     <h1> Welcome </h1>

</header>
   
    <main>
    <p>If you want to write <b>semantic code </b> it is <strong>important </strong>that you understand the differences!
    </p>
    <p>It was nearly one o clock when <strong><em>Sherlock Holmes </em></strong> returned from his excursion.</p>
    
     </main>
     <!-- Comments should be written as follows: 
Left-angle bracket, exclamation point and two dashes to start; two dashes and right-angle bracket to end. 
Comments are ignored by the browser. -->
    
    <footer>
    
    &copy; SETU
    
    </footer>
    
   <!-- insert footer with copyright symbol for SETU-->
    
    
</body>
</html>
